  /api/public/diet/{id}/menu:
    get:
      summary: Получить меню для диеты
      parameters:
        - name: Identifier
          in: header
          schema:
            type: string
          example: '{{identifier}}'
        - name: Application-key
          in: header
          schema:
            type: string
          example: '{{token}}'
      responses:
        '200':
          description: Меню диеты
          headers:
            Server:
              schema:
                type: string
              example: nginx
            Transfer-Encoding:
              schema:
                type: string
              example: chunked
            Connection:
              schema:
                type: string
              example: keep-alive
            Vary:
              schema:
                type: string
              example: Accept-Encoding
            Cache-Control:
              schema:
                type: string
              example: no-cache, private
            Date:
              schema:
                type: string
              example: Fri, 06 Oct 2023 12:46:26 GMT
            Access-Control-Allow-Origin:
              schema:
                type: string
              example: '*'
            X-Frame-Options:
              schema:
                type: string
              example: SAMEORIGIN
            X-XSS-Protection:
              schema:
                type: string
              example: 1; mode=block
            X-Content-Type-Options:
              schema:
                type: string
              example: nosniff
            Content-Encoding:
              schema:
                type: string
              example: gzip
          content:
            application/json:
              schema:
                type: object
