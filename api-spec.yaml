openapi: 3.0.0
info:
  title: PrivateCRM API
  version: 1.0.0
  description: >-
    ### Авторизация запросов API


    Для обращений требуется _авторизация_. Т.е. передача

    уникального hash-ключа.


    При запросах к API в HTTP заголовок Application-key, Identifier в следущем
    формате:


    ```

    Identifier: <identifier>

    Application-key: <token>

     ```
servers:
  - url: '{{url}}'
  - url: https://crm.private-crm.ru
paths:
  /api/public/findUser:
    post:
      summary: Поиск клиента
      parameters:
        - name: Identifier
          in: header
          schema:
            type: string
          example: '{{identifier}}'
        - name: Application-key
          in: header
          schema:
            type: string
          example: '{{token}}'
      responses:
        '200':
          description: Поиск клиента
          headers:
            Server:
              schema:
                type: string
              example: nginx
            Transfer-Encoding:
              schema:
                type: string
              example: chunked
            Connection:
              schema:
                type: string
              example: keep-alive
            Vary:
              schema:
                type: string
              example: Accept-Encoding
            X-Powered-By:
              schema:
                type: string
              example: PHP/8.1.30
            Cache-Control:
              schema:
                type: string
              example: no-cache, private
            Date:
              schema:
                type: string
              example: Mon, 10 Feb 2025 14:50:15 GMT
            Access-Control-Allow-Origin:
              schema:
                type: string
              example: '*'
            Content-Encoding:
              schema:
                type: string
              example: gzip
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        phone:
                          type: string
                        adr:
                          nullable: true
                        balance:
                          type: integer
                        bonus_balance:
                          type: integer
                        op_id:
                          type: integer
              example:
                items:
                  - id: 1569
                    name: я тестовый клиент
                    phone: +7 999 222-33-44
                    adr: null
                    balance: 0
                    bonus_balance: 0
                    op_id: 1
      tags:
        - Клиент
      description: Поиск клиента по номеру телефона
  /api/public/user:
    post:
      summary: Создание клиента
      parameters:
