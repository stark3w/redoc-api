  /api/public/couriers:
    get:
      summary: Получение всех курьеров
      parameters:
        - name: Identifier
          in: header
          schema:
            type: string
          example: '{{identifier}}'
        - name: Application-key
          in: header
          schema:
            type: string
          example: '{{token}}'
      responses:
        '200':
          description: Получение всех курьеров
          headers:
            Server:
              schema:
                type: string
              example: nginx
            Transfer-Encoding:
              schema:
                type: string
              example: chunked
            Connection:
              schema:
                type: string
              example: keep-alive
            Vary:
              schema:
                type: string
              example: Accept-Encoding
            X-Powered-By:
              schema:
                type: string
              example: PHP/8.1.31
            Cache-Control:
              schema:
                type: string
              example: no-cache, private
            Access-Control-Allow-Origin:
              schema:
                type: string
              example: '*'
            Content-Encoding:
              schema:
                type: string
              example: gzip
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        phone:
                          type: string
              example:
                items:
                  - id: 1
                    name: Курьер 1
                    phone: +7 999 123-45-67
                  - id: 2
                    name: Курьер 2
                    phone: +7 999 123-45-78
                  - id: 3
                    name: Курьер 3
                    phone: +7 999 123-45-90
  /api/public/dishes:
    get:
      summary: Список блюд
      parameters:
        - name: Identifier
          in: header
          schema:
            type: string
          example: '{{identifier}}'
        - name: Application-key
          in: header
          schema:
            type: string
          example: '{{token}}'
      responses:
        '200':
          description: Список блюд
          headers:
            Server:
              schema:
                type: string
              example: nginx
            Transfer-Encoding:
              schema:
                type: string
              example: chunked
            Connection:
              schema:
                type: string
              example: keep-alive
            Vary:
              schema:
                type: string
              example: Accept-Encoding
            Cache-Control:
              schema:
                type: string
              example: no-cache, private
            Date:
              schema:
                type: string
              example: Fri, 06 Oct 2023 12:45:35 GMT
            Access-Control-Allow-Origin:
              schema:
                type: string
              example: '*'
            X-Frame-Options:
              schema:
                type: string
              example: SAMEORIGIN
            X-XSS-Protection:
              schema:
                type: string
              example: 1; mode=block
            X-Content-Type-Options:
              schema:
                type: string
              example: nosniff
            Content-Encoding:
              schema:
                type: string
              example: gzip
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        title:
                          type: string
                        price:
