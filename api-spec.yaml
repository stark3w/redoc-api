                type: string
              example: chunked
            Connection:
              schema:
                type: string
              example: keep-alive
            Vary:
              schema:
                type: string
              example: Accept-Encoding
            X-Powered-By:
              schema:
                type: string
              example: PHP/8.1.30
            Cache-Control:
              schema:
                type: string
              example: no-cache, private
            Date:
              schema:
                type: string
              example: Wed, 05 Feb 2025 15:03:49 GMT
            Access-Control-Allow-Origin:
              schema:
                type: string
              example: '*'
            Content-Encoding:
              schema:
                type: string
              example: gzip
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
                    email:
                      type: string
                      format: email
                    u_sex_id:
                      type: string
                      format: utc-millisec
                    v_birthday:
                      type: string
                    phone:
                      type: string
                    contacts:
                      nullable: true
                    adr:
                      type: string
                    adrs:
                      type: array
                      items: {}
                    stopProducts:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: integer
                          title:
                            type: string
                          price:
                            type: integer
                          type:
                            type: string
                          deleted:
                            type: integer
                    stopDishes:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: integer
                          title:
                            type: string
                          price:
                            type: integer
                          net_price:
                            type: number
                          weight:
                            type: integer
                          d_image_link_full:
                            nullable: true
                          cooking_title:
                            type: string
                          d_kal:
                            type: integer
                          d_belki:
                            type: number
                          d_jiry:
                            type: number
                          d_uglevody:
                            type: number
                          d_description:
                            type: string
                          translations:
                            type: array
                            items: {}
                    bonus_from_payment:
                      type: integer
                    maximum_bonus_payment:
                      type: integer
                    is_discount_regular:
                      type: boolean
                    comment_manager:
                      nullable: true
                    comment_description:
                      nullable: true
                    comment_delivery:
                      nullable: true
                    comment_user:
                      nullable: true
                    discount:
                      type: integer
                    bonus_balance:
                      type: integer
                    op_id:
                      type: string
                      format: utc-millisec
              example:
                - id: 1569
                  name: я тестовый клиент
                  email: email@provider.zone
                  u_sex_id: '1'
                  v_birthday: 01.01.2024
                  phone: +7 999 222-33-44
                  contacts: null
                  adr: ''
                  adrs: []
                  stopProducts:
                    - id: 31
                      title: Авокадо
                      price: 800
                      type: product
                      deleted: 0
                  stopDishes:
                    - id: 1321
                      title: Овсяная каша с бананом
                      price: 0
                      net_price: 15.0543
                      weight: 205
                      d_image_link_full: null
                      cooking_title: Разогреть в микроволновой печи.
                      d_kal: 152
                      d_belki: 5.37
                      d_jiry: 5.85
                      d_uglevody: 19.51
                      d_description: "Молоко, овсяные хлопья, сахарозаменитель,\r\nбанан, мята"
                      translations: []
                  bonus_from_payment: 0
                  maximum_bonus_payment: 0
                  is_discount_regular: true
                  comment_manager: null
                  comment_description: null
                  comment_delivery: null
                  comment_user: null
                  discount: 0
                  bonus_balance: 0
                  op_id: '1'
      tags:
        - Клиент
