  /api/public/delivery/2023-11-25:
    get:
      summary: Получить курьеров по дате доставки
      parameters:
        - name: Identifier
          in: header
          schema:
            type: string
          example: '{{identifier}}'
        - name: Application-key
          in: header
          schema:
            type: string
          example: '{{token}}'
      responses: {}
  /api/public/delivery_list/2024-04-21:
    get:
      summary: Путевой лист
      parameters:
        - name: courier_id
          in: query
          schema:
            type: integer
          example: '3430'
        - name: Application-key
          in: header
          schema:
            type: string
          example: '{{token}}'
        - name: Identifier
          in: header
          schema:
            type: string
          example: '{{identifier}}'
      responses:
        '200':
          description: Путевой лист
          headers:
            Server:
              schema:
                type: string
              example: nginx
            Transfer-Encoding:
              schema:
                type: string
              example: chunked
            Connection:
              schema:
                type: string
              example: keep-alive
            Vary:
              schema:
                type: string
              example: Accept-Encoding
            X-Powered-By:
              schema:
                type: string
              example: PHP/8.1.27
            Cache-Control:
              schema:
                type: string
              example: no-cache, private
            Date:
              schema:
                type: string
              example: Tue, 28 May 2024 07:06:13 GMT
            Access-Control-Allow-Origin:
              schema:
                type: string
              example: '*'
            Content-Encoding:
              schema:
                type: string
              example: gzip
          content:
            application/json:
              schema:
                type: object
                properties:
                  Курьер:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        time:
                          nullable: true
                        interval:
                          type: string
                        order_id:
                          type: integer
                        delivery_number:
                          type: integer
                        client_name:
                          type: string
                        phone:
                          type: string
                        address:
                          type: string
                        comment:
                          type: string
                        ration:
                          type: string
                        pay_type:
                          type: string
                        persons:
                          type: integer
                        inner_comment:
                          type: string
                        menu_comment:
                          type: string
                        exclude_products:
                          type: array
                          items:
                            type: object
