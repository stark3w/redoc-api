  /api/public/user/26/payment:
    get:
      summary: Просмотр бонусных поступлений
      parameters:
        - name: Identifier
          in: header
          schema:
            type: string
          example: '{{identifier}}'
        - name: Application-key
          in: header
          schema:
            type: string
          example: '{{token}}'
      responses:
        '200':
          description: Просмотр бонусных поступлений
          headers:
            Server:
              schema:
                type: string
              example: nginx
            Transfer-Encoding:
              schema:
                type: string
              example: chunked
            Connection:
              schema:
                type: string
              example: keep-alive
            Vary:
              schema:
                type: string
              example: Accept-Encoding
            X-Powered-By:
              schema:
                type: string
              example: PHP/8.1.26
            Cache-Control:
              schema:
                type: string
              example: no-cache, private
            Date:
              schema:
                type: string
              example: Thu, 08 Feb 2024 13:21:43 GMT
            Access-Control-Allow-Origin:
              schema:
                type: string
              example: '*'
            Content-Encoding:
              schema:
                type: string
              example: gzip
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    type:
                      type: string
                    sum:
                      type: string
                      format: utc-millisec
                    description:
                      type: string
              example:
                - id: 5451
                  type: CRED_BONUS
                  sum: '0.00'
                  description: Возврат средств
                - id: 8880
                  type: DEB_BONUS
                  sum: '200.00'
                  description: ''
                - id: 8881
                  type: DEB_BONUS
                  sum: '500.00'
                  description: ''
                - id: 8882
                  type: DEB
                  sum: '100.00'
                  description: Оплата заказа №8052
      tags:
        - Клиент
